apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: db
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  #pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      containers:
      - name: redis
        image: redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop 
  # service labels
  labels: 
    project: roboshop
    tier: frontend
    component: frontend
spec:
  # service user the below labels to select the pods
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
    - protocol: TCP
      port: 6379  # service port
      targetPort: 6379 # container port 
       
